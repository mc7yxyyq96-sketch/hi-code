name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Tests never launch Electron; skip the ~100MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        run: npm run build

      - name: Syntax check
        run: npm run check:syntax

      - name: Run all test suites
        run: |
          set -e
          for t in feature services jobs providers worktrees arena industrial \
                   domain-packs agent-team industrial-tools quality-gates \
                   release-builder samples dod renderer entrypoints security; do
            echo "=== test:$t ==="
            npm run -s "test:$t"
          done

      - name: Definition-of-Done scan
        run: npm run -s scan:dod
